services:
  - type: web
    name: campusguard-backend
    runtime: python
    buildCommand: "./backend/build.sh"
    startCommand: "gunicorn --chdir backend attend_backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: campusguard-db
          property: connectionString

databases:
  - name: campusguard-db
    databaseName: campusguard
    user: campusguard_user
    plan: free
